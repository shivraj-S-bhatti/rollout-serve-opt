name: monolithic_apc_prefix
description: Rung-1 software baseline with chunked prefill, L1+L2 prefix caching, and cache-aware routing
mode: monolithic
routing_policy: prefix_aware
num_gpus: 8
prefill_gpus: 0
decode_gpus: 0
pool_allocation: {}
max_num_seqs: 64
max_num_batched_tokens: 4096
chunked_prefill_tokens: 2048
prefix_caching: true
l2_ram_offload: true
prefix_weight: 0.65
