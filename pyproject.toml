[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rollout-serve-opt"
version = "0.1.0"
description = "Calibrated LLM inference and RL rollout topology optimizer: continuous batching, L1/L2 KV prefix routing, interconnect-aware P/D disaggregation, NNLS calibration, and determinism guardrails."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pydantic>=2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
rollout-serve-opt = "inference.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests/python"]
